name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Astro project
        run: npm run astro -- check

      - name: Build static site
        run: npm run build

      - name: Validate Markdown, links, routes, examples, and secrets
        run: npm run validate

      - name: Smoke test static preview
        run: npm run preview:smoke
